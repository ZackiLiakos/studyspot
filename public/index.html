<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudySpot - Find and Book Study Rooms</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>StudySpot 📚</h1>
        <p>Find and book a study room on campus easily and smoothly.</p>
        <button id="myBookingsBtn" onclick="openMyBookingsModal()">My Bookings</button>
    </header>

    <main>
        <!-- Filter och söksektion -->
        <div class="filter-container" style="margin: 20px auto; text-align: center;">
            <input type="text" id="searchInput" placeholder="Search study rooms..." oninput="filterRooms()">
            
            <!-- Våningsplans-filter -->
            <select id="floorFilter" onchange="filterRooms()">
                <option value="">All Floors</option>
                <option value="1">Floor 1</option>
                <option value="2">Floor 2</option>
                <option value="3">Floor 3</option>
            </select>

            <input type="date" id="dateFilter" onchange="fetchRoomsForDate()">
        </div>

        <section>
            <h2>Available Study Rooms</h2>
            <div id="roomList" class="room-grid"></div>
        </section>
    </main>

    <!-- Modal för "My Bookings" -->
    <div id="myBookingsModal" class="modal" style="display:none;">
        <div class="modal-content">
            <span class="close" onclick="closeMyBookingsModal()">&times;</span>
            <h2>My Bookings 📚</h2>
            <label for="usernameInput">Username:</label>
            <input type="text" id="usernameInput" placeholder="Enter your username">
            <button onclick="fetchUserBookings()">Search bookings</button>
            <div id="userBookingsList"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
