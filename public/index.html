<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudySpot - Book Study Rooms</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="container">
    <header>
        <h1>StudySpot 📚</h1>
        <p>Find and book a study room on campus easily and smoothly.</p>
    </header>

    <!-- Sök och datumväljare samlat här -->
    <div class="search-section">
        <input type="text" id="searchInput" placeholder="Search study rooms..." oninput="filterRooms()">
        <br><br>
        <label for="dateFilter"><strong>Select date: </strong></label>
        <input type="date" id="dateFilter" onchange="fetchRoomsForDate()">
    </div>

    <section class="rooms-section">
        <h2>Available Study Rooms</h2>
        <div id="roomList" class="room-grid">
            <!-- Rooms will be loaded dynamically via JavaScript -->
        </div>
    </section>
</div>

    <script src="script.js"></script>
</body>
</html>
